name: luuqapp
description: "LUUQ kiosk application."
publish_to: 'none'

version: 1.1.5+27

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  video_player: ^2.14.0
  video_player_win: ^3.2.2
  path_provider: ^2.1.6
  http: ^1.2.2
  flutter_secure_storage: ^11.1.1
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.1
  uuid: ^4.6.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/instagramqr.png
    - assets/mapsqr.png
    - assets/wifiqr.png
    - assets/menuphoto1.jpg
    - assets/luuqtanitim.mp4
    - assets/menu/
    - assets/menu/png/
    - assets/sounds/
